<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Цорын ганц</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a1c2e;
    --wine:#7a243e;
    --rose:#ff6f91;
    --rose-deep:#e0446b;
    --blush:#ffe4ec;
    --gold:#b8860b;
    --paper:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background: radial-gradient(circle at 50% 30%, #70263d 0%, #4a1526 60%, #300c18 100%);
    color: var(--blush);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .scrollwrap{
    scroll-snap-type: y proximity;
  }
  section{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:6vh 4vw;
    scroll-snap-align:start;
  }
  .display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    line-height:1.2;
    color:var(--paper);
    text-shadow:0 0 30px rgba(255,111,145,0.4);
  }
  #hero .display{ font-size:clamp(1.8rem, 7vw, 4rem); letter-spacing:0.01em;}
  #line2 .display{ font-size:clamp(1.5rem, 5.5vw, 2.6rem); }
  #line2 .display span{ display:block; color:var(--rose); font-style:italic; margin-top:0.4em;}
  #finale .display{ font-size:clamp(2rem, 7.5vw, 4.2rem); color:var(--rose); }

  .eyebrow{
    font-size:0.7rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:0.8em;
    opacity:0.9;
  }

  .cue{
    font-size:0.78rem;
    color:var(--blush);
    opacity:0.75;
    letter-spacing:0.06em;
    margin-top:1.5em;
  }
  .cue::after{
    content:"";
    display:block;
    width:1px; height:18px;
    background:linear-gradient(var(--rose), transparent);
    margin:6px auto 0;
    animation: pulldown 1.8s ease-in-out infinite;
  }
  @keyframes pulldown{ 0%,100%{opacity:.2; transform:translateY(0);} 50%{opacity:1; transform:translateY(5px);} }

  /* floating hearts */
  .hearts{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .heart{
    position:absolute; bottom:-10vh;
    color:var(--rose);
    opacity:0.4;
    font-size:1.1rem;
    animation-name: floatup;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes floatup{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
  }

  section > *{ position:relative; z-index:1; }

  /* photo gallery slider */
  .photo-caption{ 
    font-size:0.8rem; 
    letter-spacing:0.1em; 
    color:var(--gold); 
    margin-bottom:1.2em; 
    text-transform:uppercase; 
    opacity:0.9;
  }
  
  .gallery-container{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(8px, 2.5vw, 16px);
    position:relative;
    width:100%;
    max-width:380px;
  }

  .polaroid-viewer{
    width:clamp(160px, 55vw, 210px);
    background:var(--paper);
    padding:10px 10px 20px;
    border-radius:4px;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, opacity 0.25s ease;
    flex-shrink:0;
  }

  /* Зургийг агуулж буй хэсэг */
  .polaroid-viewer .frame{
    width:100%; aspect-ratio:1/1.05;
    border-radius:2px;
    background: #2a0f1a;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* Зурганд зориулсан CSS тохиргоо */
  .polaroid-viewer .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .polaroid-viewer p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--wine);
    font-size:1rem;
    text-align:center;
    margin-top:8px;
    font-weight:600;
  }

  /* Navigation Arrow Buttons */
  .arrow-btn{
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 214, 224, 0.35);
    color: #fff;
    width: clamp(38px, 10vw, 44px);
    height: clamp(38px, 10vw, 44px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1rem, 4vw, 1.3rem);
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: all 0.2s ease;
    flex-shrink:0;
    -webkit-tap-highlight-color: transparent;
  }
  .arrow-btn:active{
    background: var(--rose-deep);
    transform: scale(0.92);
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .heart, .cue::after{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="scrollwrap">

  <section id="hero">
    <div class="eyebrow">— Эхлэл —</div>
    <h1 class="display">Энэ дэлхийд<br>дахин давтагдашгүй нэгэн</h1>
    <div class="cue">Доошоо гүйлгээрэй</div>
  </section>

  <section id="line2">
    <h2 class="display">
      Бие жижиг ч бэлчээр том,
      <span>жаахан хүүхэд шиг харагддаг ч том анай</span>
    </h2>
    <div class="cue">Доошоо гүйлгээрэй</div>
  </section>

  <section id="gallery">
    <div class="photo-caption">Яг одоо маш хөөрхөн нэгнийг харж байна.</div>
    
    <div class="gallery-container">
      <button class="arrow-btn" id="prevBtn" aria-label="Өмнөх зураг">❮</button>

      <div class="polaroid-viewer" id="polaroidCard">
        <div class="frame">
          <!-- <img> тагаар сольсон -->
          <img id="photoImg" src="" alt="Зураг">
        </div>
        <p id="photoCaption">№1</p>
      </div>
      
      <button class="arrow-btn" id="nextBtn" aria-label="Дараагийн зураг">❯</button>
    </div>
  </section>

  <section id="finale">
    <div class="eyebrow">— Төгсгөл —</div>
    <h2 class="display">Энэ дэлхийд<br>чи цорын ганц шүү</h2>
  </section>

</div>

<script>
/* ---------- floating hearts background ---------- */
(function(){
  const wrap = document.getElementById('hearts');
  const glyphs = ['♥','❤','♡'];
  for(let i=0;i<22;i++){
    const h = document.createElement('div');
    h.className='heart';
    h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    h.style.left = Math.random()*100+'vw';
    h.style.fontSize = (0.7+Math.random()*1.3)+'rem';
    h.style.setProperty('--drift', (Math.random()*60-30)+'px');
    h.style.animationDuration = (8+Math.random()*9)+'s';
    h.style.animationDelay = (Math.random()*10)+'s';
    wrap.appendChild(h);
  }
})();

/* ---------- photo slider ---------- */
const photos = [
  { url: 'https://scontent.fuln6-1.fna.fbcdn.net/v/t1.15752-9/753204391_1009465535221143_5636076830472390003_n.webp?stp=dst-webp_s960x960&_nc_cat=101&ccb=1-7&_nc_sid=9f807c&_nc_ohc=KWGmNuHx838Q7kNvwGVFhc1&_nc_oc=Ado37dtnND7_E6yOdu4RkLvaq62UcQdw6jvqLa7ggtxos2Q12CRVx-w2pgrTEgJmfMcj1IColCixRC4BCI_DX3Uk&_nc_zt=23&_nc_ht=scontent.fuln6-1.fna&_nc_ss=7b6a8&oh=03_Q7cD5wESSnGDFHo2jrock7gP807bZaCI3z27NB9gVKKhWVOoYA&oe=6A8B104E', text: '№1' },
  { url: 'https://scontent.fuln6-2.fna.fbcdn.net/v/t1.15752-9/678900404_26814506598239881_8262322899359121543_n.webp?stp=dst-webp_s960x960&_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Whbba7mwFMAQ7kNvwE2RbRM&_nc_oc=AdonYTT_AbFJjrwcDR5MR66BLJVtpFxgiJp_O3AzOOLLkexZfXyruwPTpiElQXSE1MsoPv6gYiVuD_XIpyJI6wAH&_nc_zt=23&_nc_ht=scontent.fuln6-2.fna&_nc_ss=7b6a8&oh=03_Q7cD5wHc_JdY36H-WaLgUa3oE6fn1MVt03AeTUIreYr2hV89mQ&oe=6A8B050A', text: '№2' },
  { url: 'https://scontent.fuln6-3.fna.fbcdn.net/v/t1.15752-9/753741716_1025497980334183_3967080394777651738_n.webp?stp=dst-webp_s960x960&_nc_cat=105&ccb=1-7&_nc_sid=9f807c&_nc_ohc=DU1azWSMWo4Q7kNvwEMD4ZD&_nc_oc=Adp8-YDxfoAiNDAPosQzwYKn67l-JS8m34Zi8Bcbda-ZhSsLp3pEiIIrgp2pMUUU70549tcyvm_bTNVikDaDaPrW&_nc_zt=23&_nc_ht=scontent.fuln6-3.fna&_nc_ss=7b6a8&oh=03_Q7cD5wGAOAYbD7eQu8XiBD2iL1xKLrJqO9YTUln_i3HW0MbgoA&oe=6A8AF412', text: '№3' }
];

let currentIndex = 0;

const photoImg = document.getElementById('photoImg');
const photoCaption = document.getElementById('photoCaption');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const polaroidCard = document.getElementById('polaroidCard');

// Анх ачаалагдахад 1-р зургийг харуулах
photoImg.src = photos[0].url;
photoCaption.textContent = photos[0].text;

function updatePhoto(index) {
  polaroidCard.style.opacity = '0';
  polaroidCard.style.transform = 'scale(0.95)';
  
  setTimeout(()=>{
    photoImg.src = photos[index].url;
    photoCaption.textContent = photos[index].text;
    polaroidCard.style.opacity = '1';
    polaroidCard.style.transform = 'scale(1)';
  }, 120);
}

nextBtn.addEventListener('click', ()=>{
  currentIndex = (currentIndex + 1) % photos.length;
  updatePhoto(currentIndex);
});

prevBtn.addEventListener('click', ()=>{
  currentIndex = (currentIndex - 1 + photos.length) % photos.length;
  updatePhoto(currentIndex);
});
</script>
</body>
</html>
